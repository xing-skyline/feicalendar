name: Build and publish Windows portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify release tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -ne "refs/tags/v$version") { throw 'Run this workflow on the tag matching package.json version.' }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist
      - name: Publish verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $asset = "FeiCalendar-$version-win-x64.exe"
          $hash = (Get-FileHash -LiteralPath "release/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8NoBOM
          gh release create "v$version" "release/$asset" release/SHA256SUMS.txt --verify-tag --title "FeiCalendar $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed.' }
